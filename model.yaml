model:
  name: brazil_model_biomass
  calliope_version: 0.6.10
  timeseries_data_path: data
  reserve_margin:
    electricity: 0.15
  subset_time:
  - '2019-01-01'
  - '2019-12-31'
  time:
    function: resample
    function_options:
      resolution: 1080H
run:
  solver: gurobi
  solver_io: python
  cyclic_storage: true
  ensure_feasibility: true
  bigM: 1e9
  zero_threshold: 1e-10
  mode: plan
  objective_options:
    cost_class:
      monetary: 1

