  - locations/links/locations_final_fuels_to_BR_for_industry.yaml
  - overrides3.yaml
  - scenarios.yaml

model:
  name: brazil_model_biomass_spores
  calliope_version: 0.6.10
  timeseries_data_path: data
  reserve_margin:
    electricity: 0.15
  subset_time:
    - '2019-01-01'
    - '2019-12-31'
  time:
    function: resample
    function_options:
      resolution: 1080H

run:
  solver: gurobi
  solver_io: python
  cyclic_storage: true
  ensure_feasibility: true
  bigM: 1e9
  zero_threshold: 1e-10
  mode: spores
  objective_options:
    cost_class:
      monetary: 1
      spores_score: 0
  spores_options:
    spores_number: 5
    slack: 0.10
    score_cost_class: spores_score
    slack_cost_group: systemwide_cost_max
    objective_cost_class:
      monetary: 0
      spores_score: 1

# The initial limit must not constrain the monetary optimum. Calliope replaces
# this value with optimal monetary cost * (1 + slack) before generating SPORES.
group_constraints:
  systemwide_cost_max.cost_max.monetary: 1e30

