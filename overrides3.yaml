overrides:

    fossil_banned:

        techs.diesel.exists: false
     #   techs.electricity_transport_light_vehicles.exists: false
    spores:
        run.solver: gurobi
        run.solver_io: python
        run.cyclic_storage: true

        run.ensure_feasibility: true
        run.bigM: 1e9
        run.zero_threshold: 1e-10

        run.mode: spores
        run.spores_options.spores_number: 10
        run.spores_options.slack: 0.1
        run.spores_options.slack_cost_group: systemwide_cost_max 
        run.objective_options.cost_class: {'monetary':1}
        group_constraints.systemwide_cost_max.cost_max.monetary: 1.0e20
        techs.ref_ethanol_1g_electricity_high.costs.spores_score.energy_cap: 0
        techs.ref_ethanol_1g_electricity_high.costs.spores_score.interest_rate: 1
        techs.ref_ethanol_1g_electricity_medium.costs.spores_score.energy_cap: 0
        techs.ref_ethanol_1g_electricity_medium.costs.spores_score.interest_rate: 1
        techs.ref_ethanol_1g_electricity_low.costs.spores_score.energy_cap: 0
        techs.ref_ethanol_1g_electricity_low.costs.spores_score.interest_rate: 1

        techs.ref_ethanol_1g_2g_high.costs.spores_score.energy_cap: 0
        techs.ref_ethanol_1g_2g_high.costs.spores_score.interest_rate: 1
        techs.ref_ethanol_1g_2g_medium.costs.spores_score.energy_cap: 0
        techs.ref_ethanol_1g_2g_medium.costs.spores_score.interest_rate: 1
        techs.ref_ethanol_1g_2g_low.costs.spores_score.energy_cap: 0
        techs.ref_ethanol_1g_2g_low.costs.spores_score.interest_rate: 1





    costs_2040:


        #### reduction of 10% (opex) and 25% (capex) in biofuel from sugarcane technologies https://www.ieabioenergy.com/wp-content/uploads/2020/02/T41_CostReductionBiofuels-11_02_19-final.pdf (page 38)
        #### It was considered the medium-term (15yrs) and pessimistic scenario

        techs.ref_ethanol_1g_electricity_high.costs.monetary.energy_cap: 1354664.25  # 0.75 x 1806219
        techs.ref_ethanol_1g_electricity_high.costs.monetary.om_annual: 16276.5 # 0.9 x 18085

        techs.ref_ethanol_1g_electricity_medium.costs.monetary.energy_cap: 1410263.25  # 0.75 x 1880351
        techs.ref_ethanol_1g_electricity_medium.costs.monetary.om_annual: 16948.8  # 0.9 x 18832

        techs.ref_ethanol_1g_electricity_low.costs.monetary.energy_cap: 1492317.0  # 0.75 x 1989756
        techs.ref_ethanol_1g_electricity_low.costs.monetary.om_annual: 17890.2  # 0.9 x 19878

        techs.ref_ethanol_1g_2g_high.costs.monetary.energy_cap: 1948542.75      # 0.75 x 2598057
        techs.ref_ethanol_1g_2g_high.costs.monetary.om_annual: 157919.4         # 0.9 x 175466

        techs.ref_ethanol_1g_2g_medium.costs.monetary.energy_cap: 2028578.25    # 0.75 x 2704771
        techs.ref_ethanol_1g_2g_medium.costs.monetary.om_annual: 158860.8       # 0.9 x 176512

        techs.ref_ethanol_1g_2g_low.costs.monetary.energy_cap: 2146501.5        # 0.75 x 2862002
        techs.ref_ethanol_1g_2g_low.costs.monetary.om_annual: 160205.4          # 0.9 x 178006

        #### Electrolyser (alkaline, 1 GW) from DEA Technology Data - Renewable fuels (Aug 2026), 2040.
        #### Converted from EUR2025/kW electrical input to USD/MW H2 output: EUR/kW x 1000 x 1.13 USD/EUR / 0.6435 (LHV efficiency).
        #### Fixed O&M as % of capex per year; stack replacement not included.
        techs.electrolyser_h2.constraints.energy_eff: 0.6435
        techs.electrolyser_h2.costs.monetary.energy_cap: 1055683  # 601.18 EUR/kW_e
        techs.electrolyser_h2.costs.monetary.om_annual: 26392  # 2.5%/yr

        #### Electricity supply price: average price of the 37th New Energy Auction (LEN A-5, Oct 2022), CCEE: 237.48 BRL/MWh.
        #### Converted with 5.22 BRL/USD (EPE PDE 2034 cost parameters, Dec 2022 base): 237.48 / 5.22 = 45.49 USD/MWh.
        techs.electricity.costs.monetary.om_prod: 45.49


